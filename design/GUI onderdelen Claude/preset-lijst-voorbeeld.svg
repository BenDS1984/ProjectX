<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorstel: presetsysteem, deel 1 - de presetbalk en de presetlijst.
  Zelfde document als Synth1OscA-v6.svg (1920 x 1200 px, eenheden 508 x 317,5).
  Presetbalk (in het vak "Preset systeem" van de bovenbalk):
   - naamveld: naam van de geladen preset, met " *" erachter zodra er iets gewijzigd is;
     tik = presetlijst openen;
   - opslaan-icoon: tik = venster "Save preset" (zie preset-vensters-voorbeeld.svg).
  Presetlijst (zelfde plaats en stijl als het wavetable-venster):
   - Init staat altijd bovenaan, zonder iconen (beschermd);
   - de geladen preset: lichte rand links en vette naam;
   - tik op een naam = laden en sluiten (bij niet-opgeslagen wijzigingen eerst "Discard changes?");
     bij laden gaat het keyboard dicht en latch uit;
   - potlood = hernoemen (venster met tekstveld), vuilbak = verwijderen (eerst bevestigen);
   - meer presets dan er passen: scrollen met de vinger, de schuif rechts toont waar je bent;
   - kruisje of tik naast het venster = sluiten zonder te laden.
  Accentkleur: neutraal lichtgrijs #c8c8c8 (de presets horen bij beide oscillatoren).
  Tekst: Lato; namen en titels voeg ik in de app toe.
-->
