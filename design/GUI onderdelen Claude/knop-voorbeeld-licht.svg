<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorbeeld: lichte draaiknop met oranje waardeboog (kleur van de SHAPE-knop uit het voorbeeld).
  Draaipunt: midden van de knop (120,120).
  Bewegingsbereik: -135° (minimum, linksonder) tot +135° (maximum, rechtsonder); 0° = recht omhoog.
  Getoonde stand: 38,6 %  ->  -135 + 0,386 x 270 = -30,8°.
  knop-waardeboog en knop-wijzer bewegen mee met de waarde; de rest staat stil.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="240px" height="240px" viewBox="0 0 240 240">

  <!-- Donkere ondergrond, alleen om het voorbeeld te tonen -->
  <g id="achtergrond" inkscape:label="achtergrond" inkscape:groupmode="layer">
    <rect x="0" y="0" width="240" height="240" fill="#2B2B2B"/>
  </g>

  <!-- Vast spoor: de volle boog van -135° tot +135° -->
  <g id="knop-spoor" inkscape:label="knop-spoor" inkscape:groupmode="layer">
    <path d="M 63.43 176.57 A 80 80 0 1 1 176.57 176.57"
          fill="none" stroke="#4A4A4A" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Waardeboog: van -135° tot de huidige stand (wordt in de app getekend) -->
  <g id="knop-waardeboog" inkscape:label="knop-waardeboog" inkscape:groupmode="layer">
    <path d="M 63.43 176.57 A 80 80 0 0 1 79.06 51.27"
          fill="none" stroke="#FF8A1E" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Licht knoplichaam -->
  <g id="knop-achtergrond" inkscape:label="knop-achtergrond" inkscape:groupmode="layer">
    <circle cx="120" cy="120" r="62" fill="#E6E6E6" stroke="#C8C8C8" stroke-width="2"/>
  </g>

  <!-- Wijzer: getekend recht omhoog (0°), gedraaid naar de huidige stand -->
  <g id="knop-wijzer" inkscape:label="knop-wijzer" inkscape:groupmode="layer"
     transform="rotate(-30.78 120 120)">
    <line x1="120" y1="94" x2="120" y2="66"
          stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
