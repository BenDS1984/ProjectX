<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorstel: verticale scrollbalk in de stijl van de verticale fader.
  Document 100 x 1068 px = de grijze strook rechts in Synth1OscA-v3.svg
  (26,46 mm breed, van onder de bovenste menubalk tot de onderrand van het scherm).
  Baan: van y = 20 tot y = 1048 (1028 px).
  Schuif: hoogte = deel van de inhoud dat in beeld is (hier ca. 40 %, dus 411 px).
  Bewegingsbereik: bovenkant schuif van y = 20 (bovenkant inhoud in beeld) tot y = 1048 - hoogte schuif
  (onderkant inhoud in beeld). De schuif beweegt alleen verticaal; zijn hoogte rekent de app uit.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="100px" height="1068px" viewBox="0 0 100 1068">

  <!-- Grijze strook, zoals in het GUI-ontwerp -->
  <g id="scroll-achtergrond" inkscape:label="scroll-achtergrond" inkscape:groupmode="layer">
    <rect x="0" y="0" width="100" height="1068" fill="#333333"/>
  </g>

  <!-- Vaste baan -->
  <g id="scroll-spoor" inkscape:label="scroll-spoor" inkscape:groupmode="layer">
    <rect x="46" y="20" width="8" height="1028" rx="4" ry="4" fill="#4A4A4A"/>
  </g>

  <!-- Schuif: grijze kap (zelfde kleur als de iconen, #C8C8C8) met drie grijplijntjes; beweegt verticaal -->
  <g id="scroll-schuif" inkscape:label="scroll-schuif" inkscape:groupmode="layer">
    <rect x="28" y="20" width="44" height="411" rx="4" ry="4" fill="#C8C8C8"/>
    <g stroke="#2B2B2B" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="215"   x2="60" y2="215"/>
      <line x1="40" y1="225.5" x2="60" y2="225.5"/>
      <line x1="40" y1="236"   x2="60" y2="236"/>
    </g>
  </g>
</svg>
