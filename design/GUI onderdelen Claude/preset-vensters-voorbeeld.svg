    <text x="67.000" y="93.000" style="font-size:9px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">Warm Pad</text>
    <g inkscape:label="knop Overwrite"><rect x="75.000" y="100.000" width="80" height="18" rx="1.6" ry="1.6" fill="#4d4d4d"/><text x="115.000" y="112.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Overwrite</text></g>
    <g inkscape:label="knop Save as new"><rect x="161.000" y="100.000" width="80" height="18" rx="1.6" ry="1.6" fill="#e6e6e6"/><text x="201.000" y="112.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#1a1a1a">Save as new</text></g>
  </g>
  <g id="venster-naam" inkscape:label="2 Save as new / Rename">
