<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorstel: presetsysteem, deel 2 - de kleine vensters. Dit is een overzichtsblad: in de app
  verschijnt telkens maar één venster, midden boven het paneel. De laag "toelichting" (grijze
  tekst met nummers) is alleen uitleg en komt niet in de app.
   1 Save preset   - na een tik op het opslaan-icoon. "Overwrite" overschrijft de geladen preset;
                     "Save as new" opent venster 2. Bij Init is "Overwrite" grijs (beschermd).
   2 Save as new   - tekstveld met de huidige naam + " 2" voorgesteld; het Android-toetsenbord
     / Rename        komt eronder op. Hetzelfde venster met titel "Rename" bij het potlood in de
                     lijst. Een naam die al bestaat: "Save" wordt grijs met een korte melding.
                     In de app staat dit venster hoger, omdat het Android-toetsenbord de onderste
                     helft van het scherm inneemt.
   3 Discard changes? - bij een preset laden of de app sluiten (exit-icoon) als er een * staat.
   4 Delete preset?   - na een tik op de vuilbak in de lijst.
  Rode knop = iets gaat verloren. Lichte knop = de hoofdkeuze. Grijze knop = annuleren.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1920" height="1200" viewBox="0 0 508 317.5">
  <sodipodi:namedview inkscape:document-units="mm" pagecolor="#ffffff"/>
