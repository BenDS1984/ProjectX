      <g id="preset-naam" inkscape:label="preset-naam (tekst in de app, Lato 11,3)"><text x="207.500" y="22.500" style="font-size:11.29px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#f9f9f9">Warm Pad *</text></g>
      <path id="preset-pijltje" inkscape:label="preset-pijltje" d="M 277.000,17.200 L 280.000,20.200 L 283.000,17.200" fill="none" stroke="#c8c8c8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="preset-opslaan" inkscape:label="preset-opslaan (tik = venster Save preset)">
      <rect x="291.2" y="6.2" width="22.6" height="24.6" rx="1.6" ry="1.6" fill="#333333"/>
      <g id="icoon-opslaan" inkscape:label="icoon-opslaan" transform="translate(293.860,9.860) scale(0.36)" fill="none" stroke="#c8c8c8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M 11,8 H 31 L 40,17 V 37 A 3,3 0 0 1 37,40 H 11 A 3,3 0 0 1 8,37 V 11 A 3,3 0 0 1 11,8 Z"/><path d="M 15,8 V 16 H 29 V 8"/><path d="M 14,40 V 27 H 34 V 40"/></g>
    </g>
  </g>
