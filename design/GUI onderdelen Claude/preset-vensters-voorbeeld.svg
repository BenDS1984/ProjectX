    <text x="277.000" y="221.000" style="font-size:9px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">“Bright Lead” will be deleted.</text>
    <g inkscape:label="knop Cancel"><rect x="285.000" y="228.000" width="80" height="18" rx="1.6" ry="1.6" fill="#4d4d4d"/><text x="325.000" y="240.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Cancel</text></g>
    <g inkscape:label="knop Delete"><rect x="371.000" y="228.000" width="80" height="18" rx="1.6" ry="1.6" fill="#c24040"/><text x="411.000" y="240.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Delete</text></g>
  </g>
  <g id="venster-save-init" inkscape:label="1b Save preset bij Init (Overwrite grijs)">
    <g inkscape:label="knop Overwrite"><rect x="75.000" y="140.000" width="80" height="18" rx="1.6" ry="1.6" fill="#2b2b2b"/><text x="115.000" y="152.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#666666">Overwrite</text></g>
    <g inkscape:label="knop Save as new"><rect x="161.000" y="140.000" width="80" height="18" rx="1.6" ry="1.6" fill="#e6e6e6"/><text x="201.000" y="152.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#1a1a1a">Save as new</text></g>
  </g>
  </g>
  <g id="toelichting" inkscape:label="toelichting (niet in de app)" inkscape:groupmode="layer">
    <text x="59.000" y="54.000" style="font-size:7px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">1  Opslaan-icoon</text>
    <text x="269.000" y="54.000" style="font-size:7px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">2  Save as new (of Rename via het potlood)</text>
    <text x="59.000" y="182.000" style="font-size:7px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">3  Laden of app sluiten met een *</text>
    <text x="269.000" y="182.000" style="font-size:7px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">4  Vuilbak in de lijst</text>
    <text x="59.000" y="136.000" style="font-size:7px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">1b  Bij Init: Overwrite grijs (beschermd)</text>
  </g>
