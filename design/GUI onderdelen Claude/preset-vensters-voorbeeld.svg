    <rect x="47.625" y="83.079" width="423.333" height="206.375" fill="#333333"/>
    <rect x="0" y="0" width="508" height="37.04" fill="#1a1a1a"/>
    <rect x="0" y="0" width="37.04" height="317.5" fill="#1a1a1a"/>
    <rect x="481.542" y="34.813" width="26.458" height="282.687" fill="#333333"/>
  </g>
  <g id="presetbalk" inkscape:label="Presetbalk" inkscape:groupmode="layer">
    <g id="preset-naamveld" inkscape:label="preset-naamveld (tik = presetlijst)">
