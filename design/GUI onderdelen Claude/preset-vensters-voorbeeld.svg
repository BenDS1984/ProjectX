    <text x="277.000" y="76.500" style="font-weight:bold;font-size:11.29px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:start;fill:#f9f9f9">Save as new</text>
    <g inkscape:label="sluiten (kruisje)" stroke="#c8c8c8" stroke-width="1.6" stroke-linecap="round"><line x1="443" y1="68" x2="451" y2="76"/><line x1="451" y1="68" x2="443" y2="76"/></g>
    <g inkscape:label="tekstveld (Android-toetsenbord typt hierin)"><rect x="277" y="84" width="174" height="20" rx="1.2" ry="1.2" fill="#262626" stroke="#c8c8c8" stroke-width="0.4"/><text x="281.000" y="97.600" style="font-size:10px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#f9f9f9">Warm Pad 2</text><line inkscape:label="cursor" x1="336.500" y1="88" x2="336.500" y2="100" stroke="#f9f9f9" stroke-width="0.6"/></g>
    <g inkscape:label="knop Cancel"><rect x="285.000" y="112.000" width="80" height="18" rx="1.6" ry="1.6" fill="#4d4d4d"/><text x="325.000" y="124.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Cancel</text></g>
    <g inkscape:label="knop Save"><rect x="371.000" y="112.000" width="80" height="18" rx="1.6" ry="1.6" fill="#e6e6e6"/><text x="411.000" y="124.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#1a1a1a">Save</text></g>
  </g>
  <g id="venster-discard" inkscape:label="3 Discard changes?">
    <rect x="59" y="188" width="190" height="66" rx="2" ry="2" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="0.4"/><path inkscape:label="venster-accent" d="M 59,190 a 2,2 0 0 1 2,-2 h 186 a 2,2 0 0 1 2,2 v 0 H 59 Z" fill="#c8c8c8" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="67.000" y="204.500" style="font-weight:bold;font-size:11.29px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:start;fill:#f9f9f9">Discard changes?</text>
    <g inkscape:label="sluiten (kruisje)" stroke="#c8c8c8" stroke-width="1.6" stroke-linecap="round"><line x1="233" y1="196" x2="241" y2="204"/><line x1="241" y1="196" x2="233" y2="204"/></g>
    <text x="67.000" y="221.000" style="font-size:9px;font-family:Lato;-inkscape-font-specification:Lato;text-anchor:start;fill:#c8c8c8">Warm Pad has unsaved changes.</text>
    <g inkscape:label="knop Cancel"><rect x="75.000" y="228.000" width="80" height="18" rx="1.6" ry="1.6" fill="#4d4d4d"/><text x="115.000" y="240.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Cancel</text></g>
    <g inkscape:label="knop Discard"><rect x="161.000" y="228.000" width="80" height="18" rx="1.6" ry="1.6" fill="#c24040"/><text x="201.000" y="240.200" style="font-weight:bold;font-size:9px;font-family:Lato;-inkscape-font-specification:Lato Bold;text-anchor:middle;fill:#f9f9f9">Discard</text></g>
  </g>
  <g id="venster-delete" inkscape:label="4 Delete preset?">
