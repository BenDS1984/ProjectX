<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorstel: schermkeyboard voor Project X (2 octaven, C3 t/m C5, met octaafknoppen).
  Document 1656 x 376 px = het roze vak "Plaats keyboard" in Synth1OscA-v4.svg.
  Het keyboard scrollt niet mee; het keyboard-icoon in de linkermenubalk toont/verbergt het.
  Lagen:
    kb-achtergrond   : paneel in de kleur van de menubalken (#1A1A1A)
    kb-octaaf        : knop omhoog (+1 octaaf) en omlaag (-1 octaaf), met daartussen de laagste noot
    kb-witte-toetsen : 15 witte toetsen
    kb-zwarte-toetsen: 10 zwarte toetsen
    kb-ingedrukt     : voorbeeld van een ingedrukte toets (oranje); de app kleurt de klinkende toets zo
    kb-labels        : C-namen onderaan; tekst wordt in de app toegevoegd (lettertype Lato, normaal)
  Octaafbereik voorstel: laagste noot C1 t/m C5 (standaard C3).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1656px" height="376px" viewBox="0 0 1656 376">
<g id="kb-achtergrond" inkscape:label="kb-achtergrond" inkscape:groupmode="layer">
  <rect x="0" y="0" width="1656" height="376" fill="#1A1A1A"/>
</g>
<g id="kb-octaaf" inkscape:label="kb-octaaf" inkscape:groupmode="layer">
  <g id="octaaf-omhoog" inkscape:label="octaaf-omhoog">
    <rect x="10" y="10" width="104" height="128" rx="4" ry="4" fill="#4D4D4D"/>
    <path d="M 10,14 a 4,4 0 0 1 4,-4 h 96 a 4,4 0 0 1 4,4 v 3 H 10 Z" fill="#FF8A1E"/>
    <path d="M 48.0,83.0 L 62.0,69.0 L 76.0,83.0" fill="none" stroke="#C8C8C8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="octaaf-omlaag" inkscape:label="octaaf-omlaag">
    <rect x="10" y="238" width="104" height="128" rx="4" ry="4" fill="#4D4D4D"/>
    <path d="M 10,242 a 4,4 0 0 1 4,-4 h 96 a 4,4 0 0 1 4,4 v 3 H 10 Z" fill="#FF8A1E"/>
    <path d="M 48.0,297.0 L 62.0,311.0 L 76.0,297.0" fill="none" stroke="#C8C8C8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="62.0" y="201.0" text-anchor="middle" font-family="Lato" font-weight="bold" font-size="38" fill="#F9F9F9">C3</text>
</g>
