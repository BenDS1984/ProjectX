<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voorstel: verticale fader in dezelfde stijl als de lichte draaiknop.
  Bewegingsbereik: het midden van de schuif loopt van y = 320 (minimum, 0 %) tot y = 40 (maximum, 100 %),
  dus 280 px recht omhoog. Getoonde stand: 60 %  ->  y = 320 - 0,6 x 280 = 152.
  fader-waarde (oranje balk) en fader-schuif bewegen mee met de waarde; de rest staat stil.
  Een naam en waarde bij de fader voeg ik in de app toe.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="120px" height="360px" viewBox="0 0 120 360">

  <!-- Donkere ondergrond, alleen om het voorbeeld te tonen -->
  <g id="achtergrond" inkscape:label="achtergrond" inkscape:groupmode="layer">
    <rect x="0" y="0" width="120" height="360" fill="#2B2B2B"/>
  </g>

  <!-- Schaalstreepjes bij 0, 25, 50, 75 en 100 % -->
  <g id="fader-schaal" inkscape:label="fader-schaal" inkscape:groupmode="layer"
     stroke="#5A5A5A" stroke-width="2" stroke-linecap="round">
    <line x1="22" y1="40"  x2="32" y2="40"/>
    <line x1="26" y1="110" x2="32" y2="110"/>
    <line x1="22" y1="180" x2="32" y2="180"/>
    <line x1="26" y1="250" x2="32" y2="250"/>
    <line x1="22" y1="320" x2="32" y2="320"/>
  </g>

  <!-- Vast spoor: de volle baan van onder naar boven -->
  <g id="fader-spoor" inkscape:label="fader-spoor" inkscape:groupmode="layer">
    <rect x="57" y="34" width="6" height="292" rx="3" ry="3" fill="#4A4A4A"/>
  </g>

  <!-- Waardebalk: van onder (0 %) tot het midden van de schuif (wordt in de app getekend) -->
  <g id="fader-waarde" inkscape:label="fader-waarde" inkscape:groupmode="layer">
    <rect x="57" y="152" width="6" height="174" rx="3" ry="3" fill="#FF8A1E"/>
  </g>

  <!-- Schuif: lichte kap met donker middenstreepje, beweegt verticaal -->
  <g id="fader-schuif" inkscape:label="fader-schuif" inkscape:groupmode="layer">
    <rect x="38" y="140" width="44" height="24" rx="3" ry="3"
          fill="#E6E6E6" stroke="#C8C8C8" stroke-width="2"/>
    <line x1="46" y1="152" x2="74" y2="152"
          stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
